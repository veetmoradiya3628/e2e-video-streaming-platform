name: Provision SQS Queue

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment name (dev, staging, prod)"
        required: true
        default: "dev"
      queue_base_name:
        description: "Base name for the SQS queue"
        required: true
        default: "video-processing"

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Create SQS Queue
      id: create_queue
      run: |
        ENV="${{ github.event.inputs.environment }}"
        BASE="${{ github.event.inputs.queue_base_name }}"
        QUEUE_NAME="${BASE}-${ENV}"

        echo "Creating SQS queue: $QUEUE_NAME"

        # Create queue and get URL
        QUEUE_URL=$(aws sqs create-queue \
          --queue-name "$QUEUE_NAME" \
          --attributes VisibilityTimeout=60 \
          --query 'QueueUrl' \
          --output text)

        echo "Queue URL: $QUEUE_URL"

        # Save to GITHUB_ENV for later steps
        echo "QUEUE_URL=$QUEUE_URL" >> $GITHUB_ENV

    - name: Tag the Queue
      run: |
        ENV="${{ github.event.inputs.environment }}"
        aws sqs tag-queue \
          --queue-url "$QUEUE_URL" \
          --tags Environment="$ENV" ManagedBy=GitHubActions

    - name: Verify Queue
      run: |
        aws sqs get-queue-attributes \
          --queue-url "$QUEUE_URL" \
          --attribute-names All
